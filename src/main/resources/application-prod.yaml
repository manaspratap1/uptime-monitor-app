server:
  port: ${PORT:8001}
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 1000
    max-connections: 2000

spring:
  config:
    import: optional:file:.env.properties

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_FROM}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  data:
  redis:
    url: ${REDIS_URL}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-southeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      sqs:
        queue-not-found-strategy: fail

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never