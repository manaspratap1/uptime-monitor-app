version: '3.8'

services:
  localstack:
    image: localstack/localstack
    container_name: uptime-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - DEFAULT_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}

  postgres:
    image: postgres:15-alpine
    container_name: uptime-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: uptimedb

  redis:
    image: redis:7-alpine
    container_name: uptime-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: uptime-app
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - localstack
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://uptime-postgres:5432/uptimedb
      - SPRING_DATA_REDIS_HOST=uptime-redis
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=http://uptime-localstack:4566
      - SPRING_CLOUD_AWS_SNS_ENDPOINT=http://uptime-localstack:4566