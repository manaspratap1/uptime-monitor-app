services:
  localstack:
    image: localstack/localstack
    container_name: uptime-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
    healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
        interval: 5s
        timeout: 5s
        retries: 20

  postgres:
    image: postgres:15-alpine
    container_name: uptime-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: uptimedb

  redis:
    image: redis:7-alpine
    container_name: uptime-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: uptime-app
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      localstack:
        condition: service_healthy
    environment:
        DATABASE_URL: jdbc:postgresql://uptime-postgres:5432/uptimedb
        DATABASE_USERNAME: admin
        DATABASE_PASSWORD: rootpassword
        REDIS_HOST: uptime-redis
        REDIS_PORT: 6379

        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_REGION: us-east-1
        AWS_SQS_ENDPOINT: http://uptime-localstack:4566

        MAIL_FROM: ${MAIL_FROM}
        MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}

